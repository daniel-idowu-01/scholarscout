global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: scholarscout-dev
    environment: development

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # ScholarScout API
  - job_name: scholarscout-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # OTel Collector
  - job_name: otel-collector
    static_configs:
      - targets: ["otelcollector:8889"]

  # Redis
  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]

  # PostgreSQL (via postgres_exporter)
  - job_name: postgresql
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Celery (via flower)
  - job_name: celery-flower
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: /metrics
