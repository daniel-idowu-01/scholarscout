[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarscout"
version = "0.1.0"
description = "Production-grade graduate opportunity discovery and recommendation platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",

    # Caching & Messaging
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.4.0",

    # Object Storage
    "boto3>=1.35.0",
    "aioboto3>=13.0.0",

    # HTTP & Crawling
    "httpx[http2]>=0.27.0",
    "requests>=2.32.0",
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "trafilatura>=1.12.0",
    "tldextract>=5.1.0",
    "url-normalize>=1.4.3",
    "chardet>=5.2.0",

    # Search
    "opensearch-py[async]>=2.7.0",

    # Auth
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",

    # Validation & Serialization
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",

    # LLM providers
    "openai>=1.51.0",
    "anthropic>=0.36.0",
    "tiktoken>=0.8.0",

    # Text Processing
    "langdetect>=1.0.9",
    "dateparser>=1.2.0",

    # Observability
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "sentry-sdk[fastapi,celery,sqlalchemy]>=2.15.0",
    "structlog>=24.4.0",

    # Resilience
    "tenacity>=9.0.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "ulid-py>=1.1.0",
    "python-slugify>=8.0.0",

    # Email
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.4",

    # Scheduling
    "celery[beat]>=5.4.0",
    "croniter>=3.0.0",

    # Cryptography
    "cryptography>=43.0.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "testcontainers[postgresql,redis]>=4.8.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "types-redis>=4.6.0",
    "types-python-dateutil>=2.9.0",
    "pre-commit>=4.0.0",
    "ipython>=8.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scholarscout"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"migrations/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing -v"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
